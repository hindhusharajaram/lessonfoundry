services:
  - type: web
    name: lessonfoundry-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.5-flash
      - key: DATABASE_URL
        value: sqlite:///data/lessonfoundry.db
